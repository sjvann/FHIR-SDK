name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          mkdir -p LocalNuget
          dotnet restore Fhir.Sdk.slnx

      - name: Test
        run: dotnet test Fhir.Sdk.slnx --no-restore --verbosity minimal

      - name: Build Release
        run: dotnet build Fhir.Sdk.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Fhir.Sdk.slnx -c Release -o LocalNuget --no-build

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "LocalNuget/*.nupkg" \
            --source "https://nuget.pkg.github.com/sjvann/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
